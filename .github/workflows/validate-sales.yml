name: Validate sales landing
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check public HTML resources
        run: |
          test -f dist/recursos/ruta-estudio.html
          test -f dist/recursos/formulas-y-errores.html
          test -f dist/recursos/repaso-preexamen.html
